{% extends 'base.html' %}
{% load static %}
{% block content %}

    <!-- Trip Details -->
    <section id="details">
        <div id="details-wrapper">
            <h2>Trip Details</h2>

            {% if trip %}
                <img src="{{ trip.image_url }}" alt="{{ trip.destination }}"/>
                <!-- trip destination -->
            {% else %}
                <!-- trip image if there is such, otherwise display the default one -->
                <img src="{% static 'images/default-trip.jpg' %}" alt="Kyoto, Japan img"/>
            {% endif %}

            <p id="details-title">{{ trip.destination }}</p>
            <div id="info-wrapper">
                <div id="details-description">

                    <!-- trip start date in format "D d M Y" -->
                    <p class="description">{{ trip.start_date|date:"D d M Y" }}</p>
                    <!-- trip duration -->
                    <p>{{ trip.destination }}</p>
                    <!-- trip summary -->
                    <p>{{ trip.summary }}</p>

                </div>
            </div>

            <!--Edit and Delete buttons -->
            <div id="action-buttons">
                <a href="{% url 'edit-trip' pk=trip.pk %}" id="edit-btn">Edit</a>
                <a href="{% url 'delete-trip' pk=trip.pk %}" id="delete-btn">Delete</a>
            </div>
        </div>
    </section>

{% endblock %}
